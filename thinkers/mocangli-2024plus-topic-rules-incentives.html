<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M10 · 规则、激励与制度条件</title><style>body{margin:0;background:#f5f6f8;color:#17191c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8}.w{max-width:920px;margin:auto;padding:30px 22px 90px}a{color:inherit}.hero{padding:45px 0}.k{font-size:12px;color:#6b7280;font-weight:800;letter-spacing:.12em}h1{font-size:44px;margin:8px 0 12px}.lead{color:#6b7280}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;margin-top:12px}.card h2{margin:0 0 8px;font-size:24px}.card p{margin:6px 0;color:#4b5563}.src{font-size:12px;color:#6b7280;border-top:1px solid #e5e7eb;margin-top:14px;padding-top:12px}</style></head><body><div class="w"><a href="mocangli-2024plus-library.html#m10">← 返回 M10</a><div class="hero"><div class="k">M10 · M02 · SOURCE ONLY</div><h1>规则、激励与制度条件</h1><p class="lead">很多行为不是“人变坏了”，而是规则改变了什么行为更划算。</p></div><div class="card"><h2>核心机制</h2><p>激励、监督、责任分配和惩罚结构会改变行为概率。与其只问“这个人道德好不好”，不如看制度如何奖励、纵容或抑制某类行为。</p></div><div class="card"><h2>现实意义</h2><p>规则既是约束，也是博弈条件。理解规则不是鼓励钻空子，而是避免用人格解释制度产生的稳定结果。</p></div><div class="card"><h2>边界</h2><p>结构解释不等于免除个体责任；它只是把“为什么反复发生”从道德谴责推进到机制层。</p><div class="src">主要证据：000336 · 2026-08-14 关于“人性的恶”的回答；001772 · 2026-03-02。</div></div></div></body></html>
