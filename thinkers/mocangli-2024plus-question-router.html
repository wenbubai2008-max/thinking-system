];let active='全部';const grid=document.getElementById('grid'),search=document.getElementById('search'),filters=document.getElementById('filters'),summary=document.getElementById('summary');function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function setup(){const ds=['全部',...new Set(data.map(x=>x.d))];filters.innerHTML=ds.map(x=>`<button class="${x===active?'active':''}" data-d="${esc(x)}">${esc(x)}</button>`).join('');filters.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.d;setup();render()})}function render(){const q=search.value.trim().toLowerCase();const list=data.filter(x=>(active==='全部'||x.d===active)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));summary.textContent=`${list.length} / ${data.length} 个典型问题 · 8 个现实领域 · 路由到79个小主题体系`;grid.innerHTML=list.length?list.map(x=>`<article class="card"><div class="tag">${esc(x.d)}</div><h2>${esc(x.q)}</h2><div class="why">${esc(x.w)}</div><div class="ask"><b>先问</b>${x.a.map(y=>`<span>• ${esc(y)}</span>`).join('')}</div><div class="topics">${x.t.map(([n,u])=>`<a href="${esc(u)}">${esc(n)}</a>`).join('')}</div><a class="flow" href="mocangli-2024plus-analysis-flow.html">套用八步分析流程 →</a></article>`).join(''):'<div class="empty">没有匹配的问题。</div>'}search.addEventListener('input',render);setup();render()</script></body></html>
