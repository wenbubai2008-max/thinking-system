<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M08 · 抽象词与语义拆解</title><style>body{margin:0;background:#f5f6f8;color:#17191c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8}.w{max-width:920px;margin:auto;padding:30px 22px 90px}a{color:inherit}.hero{padding:45px 0}.k{font-size:12px;color:#6b7280;font-weight:800;letter-spacing:.12em}h1{font-size:44px;margin:8px 0 12px}.lead{color:#6b7280}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;margin-top:12px}.card h2{margin:0 0 8px;font-size:24px}.card p{margin:6px 0;color:#4b5563}.src{font-size:12px;color:#6b7280;border-top:1px solid #e5e7eb;margin-top:14px;padding-top:12px}</style></head><body><div class="w"><a href="mocangli-2024plus-library.html#m08">← 返回 M08</a><div class="hero"><div class="k">M08 · SOURCE ONLY</div><h1>抽象词与语义拆解</h1><p class="lead">很多“正确的话”之所以难反驳，是因为词本身没有清晰边界。</p></div><div class="card"><h2>核心机制</h2><p>“过度努力”“强者”“成熟”“毁掉”“善良”等抽象词如果缺少可观察定义，就容易把情绪评价伪装成因果解释。</p></div><div class="card"><h2>常用拆法</h2><p>问：这个词具体指什么行为？边界在哪里？不同人是否用的是同一个定义？它能不能预测现实差异？</p></div><div class="card"><h2>边界</h2><p>不是反对抽象概念，而是要求抽象词在进入判断前先还原成变量、行为和条件。</p><div class="src">主要证据：003031 · 2025-03-26《为什么说「过度努力」反而可能毁掉一个人？》；001693 · 2026-03-18。</div></div></div></body></html>
