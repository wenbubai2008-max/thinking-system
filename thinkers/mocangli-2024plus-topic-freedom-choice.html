<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M13 · 自由与选择权</title><style>body{margin:0;background:#f5f6f8;color:#17191c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8}.w{max-width:920px;margin:auto;padding:30px 22px 90px}a{color:inherit}.hero{padding:45px 0}.k{font-size:12px;color:#6b7280;font-weight:800;letter-spacing:.12em}h1{font-size:44px;margin:8px 0 12px}.lead{color:#6b7280}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;margin-top:12px}.card h2{margin:0 0 8px;font-size:24px}.card p{margin:6px 0;color:#4b5563}.src{font-size:12px;color:#6b7280;border-top:1px solid #e5e7eb;margin-top:14px;padding-top:12px}</style></head><body><div class="w"><a href="mocangli-2024plus-library.html#m13">← 返回 M13</a><div class="hero"><div class="k">M13 · M05 · SOURCE ONLY</div><h1>自由与选择权</h1><p class="lead">自由更接近拥有选择、不选择和退出的现实能力。</p></div><div class="card"><h2>核心机制</h2><p>抽象自由只有在资源、技能和外部选项支持下才可执行。重点是能否拒绝、改变路径并承担后果。</p></div><div class="card"><h2>现实意义</h2><p>这把自由从口号转成生活设计变量，并与主体性、容错率和关系退出能力连接起来。</p></div><div class="card"><h2>边界</h2><p>自由始终存在约束；目标不是无约束，而是提高可自决的比例。</p><div class="src">主要证据：001663 · 2026-03-24 关于自由排序的回答。</div></div></div></body></html>
