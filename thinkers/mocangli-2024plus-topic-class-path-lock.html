<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M11 · 阶层路径锁定</title><style>body{margin:0;background:#f5f6f8;color:#17191c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8}.w{max-width:920px;margin:auto;padding:30px 22px 90px}a{color:inherit}.hero{padding:45px 0}.k{font-size:12px;color:#6b7280;font-weight:800;letter-spacing:.12em}h1{font-size:44px;margin:8px 0 12px}.lead{color:#6b7280}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;margin-top:12px}.card h2{margin:0 0 8px;font-size:24px}.card p{margin:6px 0;color:#4b5563}.src{font-size:12px;color:#6b7280;border-top:1px solid #e5e7eb;margin-top:14px;padding-top:12px}</style></head><body><div class="w"><a href="mocangli-2024plus-library.html#m11">← 返回 M11</a><div class="hero"><div class="k">M11 · M02 · SOURCE ONLY</div><h1>阶层路径锁定</h1><p class="lead">很多人不是“不努力”，而是在一个局部规则里越努力越难切换赛道。</p></div><div class="card"><h2>核心机制</h2><p>既有技能、身份、城市、网络和沉没成本会把人锁在某条路径。局部最优越稳定，离开它的短期代价越高。</p></div><div class="card"><h2>“爬错山”</h2><p>跨阶层不只是把当前山爬得更高，还要判断这座山的上限、规则和未来高度是否值得继续投入。</p></div><div class="card"><h2>边界</h2><p>换赛道本身也有风险。重点不是频繁跳跃，而是定期重新评估路径和机会成本。</p><div class="src">主要证据：001750 · 2026-03-07 关于跨阶层的回答。</div></div></div></body></html>
