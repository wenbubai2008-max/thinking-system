<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M13 · 普通人与内生幸福</title><style>body{margin:0;background:#f5f6f8;color:#17191c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8}.w{max-width:920px;margin:auto;padding:30px 22px 90px}a{color:inherit}.hero{padding:45px 0}.k{font-size:12px;color:#6b7280;font-weight:800;letter-spacing:.12em}h1{font-size:44px;margin:8px 0 12px}.lead{color:#6b7280}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;margin-top:12px}.card h2{margin:0 0 8px;font-size:24px}.card p{margin:6px 0;color:#4b5563}.src{font-size:12px;color:#6b7280;border-top:1px solid #e5e7eb;margin-top:14px;padding-top:12px}</style></head><body><div class="w"><a href="mocangli-2024plus-library.html#m13">← 返回 M13</a><div class="hero"><div class="k">M13 · M08 · SOURCE ONLY</div><h1>普通人与内生幸福</h1><p class="lead">真正的问题不只是“接受自己普通”，而是你用谁的尺子定义普通和成功。</p></div><div class="card"><h2>核心机制</h2><p>社交媒体和社会排名提供外部评价尺度。如果幸福始终依赖在这些尺度上排得更高，比较就不会结束。</p></div><div class="card"><h2>内生回路</h2><p>更稳定的方向是建立自己的目标、节奏和反馈标准，让生活质量不完全依赖外界排名。</p></div><div class="card"><h2>边界</h2><p>内生评价不意味着与社会脱节；现实收入、责任和关系仍然需要外部反馈，只是不把它们变成全部自我价值。</p><div class="src">主要证据：001783 · 2026-02-27 关于社交媒体“人均成功”与普通人幸福的回答。</div></div></div></body></html>
