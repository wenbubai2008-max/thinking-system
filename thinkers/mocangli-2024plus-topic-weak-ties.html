<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M11 · 网络与弱连接</title><style>body{margin:0;background:#f5f6f8;color:#17191c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8}.w{max-width:920px;margin:auto;padding:30px 22px 90px}a{color:inherit}.hero{padding:45px 0}.k{font-size:12px;color:#6b7280;font-weight:800;letter-spacing:.12em}h1{font-size:44px;margin:8px 0 12px}.lead{color:#6b7280}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;margin-top:12px}.card h2{margin:0 0 8px;font-size:24px}.card p{margin:6px 0;color:#4b5563}.src{font-size:12px;color:#6b7280;border-top:1px solid #e5e7eb;margin-top:14px;padding-top:12px}</style></head><body><div class="w"><a href="mocangli-2024plus-library.html#m11">← 返回 M11</a><div class="hero"><div class="k">M11 · M10 · SOURCE ONLY</div><h1>网络与弱连接</h1><p class="lead">跨阶层和跨路径机会，往往来自当前圈层之外的信息与连接。</p></div><div class="card"><h2>核心机制</h2><p>强连接提供稳定支持，弱连接更可能带来异质信息、不同规则和新机会。长期只在同质圈层中互动，容易把局部规则误认成全部世界。</p></div><div class="card"><h2>现实意义</h2><p>跨行业、跨城市、跨圈层的低成本连接，能够扩大信息样本和备选路径。</p></div><div class="card"><h2>边界</h2><p>网络不是“认识很多人”本身；真正重要的是可交换价值、信息异质性和长期可信度。</p><div class="src">主要证据：001750 · 2026-03-07 关于跨阶层的回答；001718 · 2026-03-13 关于阶层决定因素的回答。</div></div></div></body></html>
