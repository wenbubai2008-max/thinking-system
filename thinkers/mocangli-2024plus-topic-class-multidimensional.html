<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M11 · 阶层的多维状态</title><style>body{margin:0;background:#f5f6f8;color:#17191c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8}.w{max-width:920px;margin:auto;padding:30px 22px 90px}a{color:inherit}.hero{padding:45px 0}.k{font-size:12px;color:#6b7280;font-weight:800;letter-spacing:.12em}h1{font-size:44px;margin:8px 0 12px}.lead{color:#6b7280}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;margin-top:12px}.card h2{margin:0 0 8px;font-size:24px}.card p{margin:6px 0;color:#4b5563}.src{font-size:12px;color:#6b7280;border-top:1px solid #e5e7eb;margin-top:14px;padding-top:12px}</style></head><body><div class="w"><a href="mocangli-2024plus-library.html#m11">← 返回 M11</a><div class="hero"><div class="k">M11 · C级阶段模型 · SOURCE ONLY</div><h1>阶层的多维状态</h1><p class="lead">阶层更像多个变量共同维持的稳定状态，而不是只看收入的一条线。</p></div><div class="card"><h2>四个维度</h2><p>后期模型明确提出：认知、网络拓扑、资源存量、制度位置共同作用，形成类似“吸引盆地”的稳定状态。</p></div><div class="card"><h2>为什么有解释力</h2><p>只提升一个变量，其他变量可能把人重新拉回原来的稳定区；跨越往往需要多个维度同时发生变化。</p></div><div class="card"><h2>边界</h2><p>这是作者后期明确标出的思考模型，不是经过实证验证的统一阶层理论，应作为分析工具而非定律。</p><div class="src">主要证据：001718 · 2026-03-13 关于“什么决定阶层”的回答。</div></div></div></body></html>
