<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>墨苍离 2024+ · 思想卡片</title><style>:root{--bg:#f5f6f8;--card:#fff;--text:#17191c;--muted:#6b7280;--line:#e5e7eb;--soft:#f1f2f4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.72}a{color:inherit;text-decoration:none}.wrap{max-width:1120px;margin:auto;padding:28px 22px 90px}.top{display:flex;justify-content:space-between;gap:16px;font-size:13px;color:var(--muted)}.hero{padding:48px 0 24px}.eyebrow{font-size:12px;letter-spacing:.14em;font-weight:800;color:var(--muted)}h1{font-size:46px;line-height:1.1;margin:8px 0 12px}.lead{color:var(--muted);font-size:17px;max-width:900px}.toolbar{position:sticky;top:0;z-index:5;background:rgba(245,246,248,.94);backdrop-filter:blur(10px);padding:10px 0 14px}.search{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:#fff;font:inherit}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.filters button{border:0;background:var(--soft);padding:7px 10px;border-radius:999px;font:inherit;font-size:12px;cursor:pointer}.filters button.active{background:#17191c;color:#fff}.summary{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 20px;color:var(--muted);font-size:12px}.summary span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}.id{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.1em}.card h2{font-size:21px;margin:6px 0}.claim{font-weight:800;margin:8px 0}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.meta span{font-size:11px;background:var(--soft);padding:4px 7px;border-radius:999px}.evidence{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.evidence b{color:var(--text)}.evidence a{display:block;margin-top:5px;color:var(--text);font-weight:700}.empty{grid-column:1/-1;padding:40px;text-align:center;color:var(--muted)}.footer{margin-top:24px;color:var(--muted);font-size:12px}@media(max-width:720px){h1{font-size:36px}.grid{grid-template-columns:1fr}.top{flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><a href="mocangli-2024plus.html">← 返回 2024+ 思想库</a><a href="mocangli-2024plus-evidence.html">证据与边界 →</a></div><header class="hero"><div class="eyebrow">LAYER 03 · THOUGHT CARDS · SOURCE ONLY</div><h1>思想卡片</h1><p class="lead">当前已整理50张可追溯卡片。每张卡绑定本次 2024+ 原始语料中的条目编号、日期、问题标题和原始链接。A=作者明确表达，B=跨文本稳定归纳，C=阶段性强模型。</p></header><div class="toolbar"><input id="search" class="search" placeholder="搜索：认知、概率、焦虑、善良、阶层、自由……"><div id="filters" class="filters"></div></div><div id="summary" class="summary"></div><main id="grid" class="grid"><div class="empty">正在读取思想卡片…</div></main><div class="footer">硬规则：只使用本次提供的 canglimo_2024plus 语料。卡片标题与归纳文字属于研究性整理，不冒充作者原句；点击证据标题可回到原始知乎条目。</div></div><script>let cards=[],active='全部';const grid=document.getElementById('grid'),search=document.getElementById('search'),filters=document.getElementById('filters'),summary=document.getElementById('summary');const params=new URLSearchParams(location.search);const levelName={A:'A · 作者明确表达',B:'B · 跨文本归纳',C:'C · 阶段性强模型'};function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function syncUrl(){const p=new URLSearchParams();if(active!=='全部')p.set('cat',active);if(search.value.trim())p.set('q',search.value.trim());history.replaceState(null,'',location.pathname+(p.toString()?'?'+p.toString():''))}function setup(){const cats=['全部',...new Set(cards.map(x=>x.category))];if(!cats.includes(active))active='全部';filters.innerHTML=cats.map(c=>`<button data-cat="${esc(c)}" class="${c===active?'active':''}">${esc(c)}</button>`).join('');filters.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.cat;setup();render();syncUrl()})}function render(){const q=search.value.trim().toLowerCase();const list=cards.filter(c=>(active==='全部'||c.category===active)&&(!q||JSON.stringify(c).toLowerCase().includes(q)));summary.innerHTML=`<span>${list.length} 张当前结果</span><span>${cards.length} 张已挂证据卡片</span><span>Source Only</span>`;grid.innerHTML=list.length?list.map(c=>`<article class="card"><div class="id">${esc(c.id)} · ${esc(c.category)}</div><h2>${esc(c.title)}</h2><div class="claim">${esc(c.claim)}</div><div class="meta"><span>${esc(levelName[c.level]||c.level)}</span><span>${esc(c.module)}</span><span>条目 ${esc(c.evidence.source_id)}</span></div><div class="evidence"><b>${esc(c.evidence.date)}</b> · 原始问题<a href="${esc(c.evidence.url)}" target="_blank" rel="noopener">${esc(c.evidence.question)} ↗</a></div></article>`).join(''):'<div class="empty">没有匹配的思想卡片。</div>'}search.addEventListener('input',()=>{render();syncUrl()});Promise.all([fetch('mocangli-2024plus-cards.json').then(r=>r.json()),fetch('mocangli-2024plus-cards-extra-01.json').then(r=>r.json())]).then(([a,b])=>{cards=[...a,...b];active=params.get('cat')||'全部';search.value=params.get('q')||'';setup();render()}).catch(()=>{grid.innerHTML='<div class="empty">卡片数据暂时加载失败，请刷新页面。</div>'})</script></body></html>
