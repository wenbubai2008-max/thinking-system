<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M10 · 稀缺性与议价权</title><style>body{margin:0;background:#f5f6f8;color:#17191c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8}.w{max-width:920px;margin:auto;padding:30px 22px 90px}a{color:inherit}.hero{padding:45px 0}.k{font-size:12px;color:#6b7280;font-weight:800;letter-spacing:.12em}h1{font-size:44px;margin:8px 0 12px}.lead{color:#6b7280}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;margin-top:12px}.card h2{margin:0 0 8px;font-size:24px}.card p{margin:6px 0;color:#4b5563}.src{font-size:12px;color:#6b7280;border-top:1px solid #e5e7eb;margin-top:14px;padding-top:12px}</style></head><body><div class="w"><a href="mocangli-2024plus-library.html#m10">← 返回 M10</a><div class="hero"><div class="k">M10 · M05 · SOURCE ONLY</div><h1>稀缺性与议价权</h1><p class="lead">议价权来自“别人需要你”与“你可以不接受”这两个方向同时存在。</p></div><div class="card"><h2>核心机制</h2><p>可替代性越高、外部选项越少，越难在分配中争取更多。稀缺技能、资源和关系网络提高被需要程度；退出能力提高拒绝能力。</p></div><div class="card"><h2>现实化</h2><p>不要只问“我有没有价值”，还要问“这个价值是否稀缺、是否被看见、对方忽视我的成本多高、我是否有替代路径”。</p></div><div class="card"><h2>边界</h2><p>议价权不是支配别人，而是在交换关系中减少被单方面定价。</p><div class="src">主要证据：001508 · 2026-04-26；002451 · 2025 年关于重大利益争取的回答。</div></div></div></body></html>
