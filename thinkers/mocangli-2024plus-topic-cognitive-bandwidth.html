<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M07 · 认知带宽与决策负荷</title><style>body{margin:0;background:#f5f6f8;color:#17191c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8}.w{max-width:920px;margin:auto;padding:30px 22px 90px}a{color:inherit}.hero{padding:45px 0}.k{font-size:12px;color:#6b7280;font-weight:800;letter-spacing:.12em}h1{font-size:44px;margin:8px 0 12px}.lead{color:#6b7280}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;margin-top:12px}.card h2{margin:0 0 8px;font-size:24px}.card p{margin:6px 0;color:#4b5563}.src{font-size:12px;color:#6b7280;border-top:1px solid #e5e7eb;margin-top:14px;padding-top:12px}</style></head><body><div class="w"><a href="mocangli-2024plus-library.html#m07">← 返回 M07</a><div class="hero"><div class="k">M07 · SOURCE ONLY</div><h1>认知带宽与决策负荷</h1><p class="lead">心理稳定不只靠想开，也取决于每天有多少无意义决策和猜测在消耗算力。</p></div><div class="card"><h2>核心机制</h2><p>零碎决策、反复猜别人怎么想、角色边界模糊，会持续占用工作记忆和注意力。问题不一定在于“意志力差”，也可能是系统把太多低价值任务留给大脑实时处理。</p></div><div class="card"><h2>常用解法</h2><p>模板化、记录、固定流程、角色—任务分离、减少无意义选择，让大脑从重复调度中释放出来。</p></div><div class="card"><h2>边界</h2><p>这不是把生活机械化，而是把不值得反复思考的部分外部化，把带宽留给真正需要判断的问题。</p><div class="src">主要证据：002189 · 2025-10-12《维持心理健康有什么极简的建议？》。</div></div></div></body></html>
