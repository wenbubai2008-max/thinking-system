<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M09 · 正义与结果</title><style>body{margin:0;background:#f5f6f8;color:#17191c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8}.w{max-width:920px;margin:auto;padding:30px 22px 90px}a{color:inherit}.hero{padding:45px 0}.k{font-size:12px;color:#6b7280;font-weight:800;letter-spacing:.12em}h1{font-size:44px;margin:8px 0 12px}.lead{color:#6b7280}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;margin-top:12px}.card h2{margin:0 0 8px;font-size:24px}.card p{margin:6px 0;color:#4b5563}.src{font-size:12px;color:#6b7280;border-top:1px solid #e5e7eb;margin-top:14px;padding-top:12px}</style></head><body><div class="w"><a href="mocangli-2024plus-library.html#m09">← 返回 M09</a><div class="hero"><div class="k">M09 · SOURCE ONLY</div><h1>正义与结果</h1><p class="lead">“行为看起来公平”不保证最终结果一定公平，反过来也不能只用结果给过程定性。</p></div><div class="card"><h2>核心机制</h2><p>正义至少涉及规则、程序、机会、结果与责任分配多个维度。只抓其中一个维度，很容易把复杂冲突压成“谁更委屈”。</p></div><div class="card"><h2>分析方法</h2><p>分别问：规则是否一致？参与者是否有真实选择？成本由谁承担？结果差异来自规则本身、起点差异还是执行差异？</p></div><div class="card"><h2>边界</h2><p>这不是取消道德判断，而是避免只凭单一维度或情绪直觉判断复杂制度与关系。</p><div class="src">主要证据：003812 · 2024 年关于“正义行为与不正义结果”的回答；001775 · 2026 年关于正义维度的回答。</div></div></div></body></html>
