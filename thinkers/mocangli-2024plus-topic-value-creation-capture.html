<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M10 · 价值创造与价值获得</title><style>body{margin:0;background:#f5f6f8;color:#17191c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8}.w{max-width:920px;margin:auto;padding:30px 22px 90px}a{color:inherit}.hero{padding:45px 0}.k{font-size:12px;color:#6b7280;font-weight:800;letter-spacing:.12em}h1{font-size:44px;margin:8px 0 12px}.lead{color:#6b7280}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;margin-top:12px}.card h2{margin:0 0 8px;font-size:24px}.card p{margin:6px 0;color:#4b5563}.src{font-size:12px;color:#6b7280;border-top:1px solid #e5e7eb;margin-top:14px;padding-top:12px}</style></head><body><div class="w"><a href="mocangli-2024plus-library.html#m10">← 返回 M10</a><div class="hero"><div class="k">M10 · SOURCE ONLY</div><h1>价值创造与价值获得</h1><p class="lead">创造价值，不会自动把价值按同样比例分配给你。</p></div><div class="card"><h2>核心机制</h2><p>工作和合作中，贡献只是第一步。最终获得多少，还取决于归因、可见性、稀缺性、议价权、网络位置和替代成本。</p></div><div class="card"><h2>最容易误读</h2><p>不是“能力没用”或“只会邀功就行”。更接近：能力决定你能否创造价值，分配机制决定你能否保留价值。</p></div><div class="card"><h2>边界</h2><p>不同组织和市场的分配机制不同，不能用单一“会做人”解释所有回报差异。</p><div class="src">主要证据：001508 · 2026-04-26《这个社会为什么大部分老实人都混得不好？》。</div></div></div></body></html>
