<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M12 · 失败与模型更新</title><style>body{margin:0;background:#f5f6f8;color:#17191c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8}.w{max-width:920px;margin:auto;padding:30px 22px 90px}a{color:inherit}.hero{padding:45px 0}.k{font-size:12px;color:#6b7280;font-weight:800;letter-spacing:.12em}h1{font-size:44px;margin:8px 0 12px}.lead{color:#6b7280}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;margin-top:12px}.card h2{margin:0 0 8px;font-size:24px}.card p{margin:6px 0;color:#4b5563}.src{font-size:12px;color:#6b7280;border-top:1px solid #e5e7eb;margin-top:14px;padding-top:12px}</style></head><body><div class="w"><a href="mocangli-2024plus-library.html#m12">← 返回 M12</a><div class="hero"><div class="k">M12 · M01 · SOURCE ONLY</div><h1>失败与模型更新</h1><p class="lead">失败更适合被当作测试结果，而不是人格判决。</p></div><div class="card"><h2>核心机制</h2><p>把失败解释为“我这个人不行”，会切断反馈；把它拆成目标、策略、资源、执行、环境等变量，才可能形成可修改的模型。</p></div><div class="card"><h2>连续光谱</h2><p>成功与失败并非永远二元。很多结果是部分成功、局部失败和下一轮可以继续迭代的中间状态。</p></div><div class="card"><h2>边界</h2><p>不是把失败美化成“都是收获”。如果没有信息更新，失败就只是损失。</p><div class="src">主要证据：000936 · 2026-05-13《对于经常失败的人你有什么极简建议？》。</div></div></div></body></html>
