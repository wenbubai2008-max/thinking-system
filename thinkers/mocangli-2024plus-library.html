<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>墨苍离 2024+ · 核心思想分类库</title><style>:root{--bg:#f5f6f8;--text:#17191c;--muted:#6b7280;--line:#e5e7eb;--soft:#f1f2f4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.72}a{color:inherit;text-decoration:none}.wrap{max-width:1080px;margin:auto;padding:28px 22px 90px}.top{display:flex;justify-content:space-between;gap:14px;font-size:13px;color:var(--muted)}.hero{padding:48px 0 24px}.eyebrow{font-size:12px;letter-spacing:.14em;font-weight:800;color:var(--muted)}h1{font-size:46px;line-height:1.1;margin:8px 0 12px}.lead{color:var(--muted);font-size:17px;max-width:900px}.status,.toc{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.status span,.toc a{font-size:12px;border-radius:999px;padding:5px 9px}.status span{background:#fff;border:1px solid var(--line)}.toc a{background:var(--soft)}.module{background:#fff;border:1px solid var(--line);border-radius:20px;padding:25px;margin-top:12px;scroll-margin-top:16px}.num{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.12em}.module h2{font-size:26px;margin:5px 0}.one{font-size:17px;font-weight:800;margin:0 0 7px}.module p{color:#4b5563;margin:6px 0}.boundary{margin:12px 0;padding:12px 14px;background:var(--soft);border-radius:12px;color:#4b5563;font-size:13px}.subgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.subtopic{position:relative;min-height:102px;padding:13px 13px 40px;background:#fafafa;border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:.15s}.subtopic:hover{transform:translateY(-1px);box-shadow:0 7px 18px rgba(0,0,0,.04)}.subtopic b{display:block;font-size:13px}.subtopic small{display:block;color:var(--muted);margin-top:4px}.count{position:absolute;left:12px;bottom:10px;font-size:11px;font-weight:800;background:var(--soft);padding:4px 7px;border-radius:999px}.count:hover{background:#17191c;color:#fff}.actions{margin-top:14px}.actions a{display:inline-block;background:#17191c;color:#fff;padding:7px 10px;border-radius:9px;font-size:12px;font-weight:800}.footer{margin-top:24px;color:var(--muted);font-size:12px}.loading{padding:50px;text-align:center;color:var(--muted)}@media(max-width:700px){h1{font-size:36px}.subgrid{grid-template-columns:1fr}.top{flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><a href="mocangli-2024plus.html">← 返回 2024+ 思想库</a><a href="mocangli-2024plus-map.html">思想关系图 →</a></div><header class="hero"><div class="eyebrow">LAYER 02 · CORE LIBRARY · SOURCE ONLY</div><h1>13个核心思想模块</h1><p class="lead">13个模块是主骨架，79个小主题是机制层，122张思想卡是证据命题层。现在79个小主题全部至少拥有1张直接主归属卡。</p></header><div id="status" class="status"><span>正在读取数据…</span></div><nav id="toc" class="toc"></nav><main id="modules"><div class="loading">正在生成分类库…</div></main><div class="footer">Source Only：所有模块、小主题与思想卡只使用本次 canglimo_2024plus 语料。点击小主题看机制页，点击“相关卡”进入思想卡与原始证据。</div></div><script>const meta={M01:['认知与信息加工','认知不是知道多少，而是怎样感知、筛选、建模、预测和更新。','从信息进入大脑，到模型形成，再到判断、行动和反馈。','不能把认知当万能解释；资源、制度位置和环境也会塑造认知。'],M02:['系统、复杂性与不确定性','复杂结果通常来自变量耦合、反馈和路径依赖。','寻找关键变量、反馈环、锁定机制和可干预点。','能用简单机制解释时，不必为了高级感过度建模。'],M03:['概率决策与容错','好的决策不只提高胜率，也要保证判断错了以后还在游戏里。','概率、基础率、尾部风险、容错与止损共同构成决策结构。','低概率毁灭性风险不能只看平均收益。'],M04:['行动、试错与反馈','行动的重要价值，是制造仅靠思考得不到的新信息。','可逆性、反馈速度和模型更新决定试错质量。','持续行动不能替代方向判断。'],M05:['主体性、独立与选择权','主体性是形成判断、做决定、承担后果，并保留现实选择空间。','心理自主需要技能、现金、网络和外部选项做底座。','主体性不是任性，也不是拒绝外部建议。'],M06:['关系、边界与合作博弈','合作不是取消防御；长期关系要看互惠、成本、边界和退出能力。','关系判断从人格标签转向长期互动结构。','一次冲突或短期舒服都不足以定义关系质量。'],M07:['情绪、焦虑与认知带宽','情绪是信号，不是事实；反刍会消耗有限的认知带宽。','心理状态会改变注意力、概率感受、解释方式与行动能力。','身体、环境和专业干预也不能被简化成“认知问题”。'],M08:['概念、叙事与模因免疫','高传播性的标签和金句会压缩现实，也会偷偷规定人的身份与行为。','拆词、拆叙事、看传播机制，恢复被一句话抹掉的条件。','祛魅不是否定一切，而是让概念重新接受现实检验。'],M09:['价值、道德、正义与立场','承认立场影响判断，同时保留事实层的求真与纠偏程序。','事实、解释、价值、利益和情绪需要分层处理。','承认立场不等于事实虚无。'],M10:['社会规则、权力与价值分配','创造价值和获得价值之间，还隔着可见性、归因、稀缺性、议价与制度。','组织与社会行为要看激励、责任、网络位置和规则成本。','分析利益结构不等于鼓励无底线博弈。'],M11:['阶层、资源与环境约束','很多“个人选择”发生在资源、网络、制度位置和环境可预测性的约束里。','阶层更像多变量长期耦合出的系统状态。','结构约束不等于个人完全无能为力。'],M12:['成长、成功与反成功学','经历、苦难、努力和成功结果都不能自动证明能力真正增长。','成长看模型是否更新，成功则需要多因果解释。','反成功学不是反对努力，而是反对把结果变成人格神话。'],M13:['自由、意义与生活设计','祛魅之后不必走向虚无；自由与意义可以落在具体选择、关系和体验中。','生活设计更关注自决、选项和局部真实意义。','没有终极答案，不等于具体意义失去合法性。']};function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}const files=['mocangli-2024plus-cards.json','mocangli-2024plus-cards-extra-01.json','mocangli-2024plus-cards-extra-02.json','mocangli-2024plus-cards-extra-03.json','mocangli-2024plus-cards-extra-04.json'];Promise.all([fetch('mocangli-2024plus-topic-card-map.json').then(r=>r.json()),Promise.all(files.map(f=>fetch(f).then(r=>r.json()))) ]).then(([map,parts])=>{const cards=parts.flat(),topics=map.topics||[],byKey={};topics.forEach(t=>byKey[t.key]=t);cards.forEach(c=>{if(c.primary_topic&&byKey[c.primary_topic]){const t=byKey[c.primary_topic];t.primary_cards=t.primary_cards||[];if(!t.primary_cards.includes(c.id))t.primary_cards.push(c.id)}});const by={};topics.forEach(t=>(by[t.module]||(by[t.module]=[])).push(t));const direct=topics.filter(t=>(t.primary_cards||[]).length).length;document.getElementById('status').innerHTML=`<span>13 个核心模块</span><span>${topics.length} 个小主题</span><span>${cards.length} 张思想卡</span><span>${direct}/${topics.length} 主题有直接主卡</span>`;document.getElementById('toc').innerHTML=Object.entries(meta).map(([k,v])=>`<a href="#${k.toLowerCase()}">${k} · ${esc(v[0].split('、')[0])}</a>`).join('');document.getElementById('modules').innerHTML=Object.entries(meta).map(([k,v])=>{const ts=by[k]||[];return `<section class="module" id="${k.toLowerCase()}"><div class="num">${k}</div><h2>${esc(v[0])}</h2><div class="one">${esc(v[1])}</div><p>${esc(v[2])}</p><div class="boundary">边界：${esc(v[3])}</div><div class="subgrid">${ts.map(t=>{const ids=new Set([...(t.primary_cards||[]),...(t.related_cards||[])]);return `<div class="subtopic" onclick="location.href='${esc(t.page)}'"><b>${esc(t.title)}</b><small>主归属 ${(t.primary_cards||[]).length} 张 · 关联 ${(t.related_cards||[]).length} 张</small><a class="count" href="mocangli-2024plus-cards.html?topic=${encodeURIComponent(t.key)}" onclick="event.stopPropagation()">相关卡 ${ids.size} 张 →</a></div>`}).join('')}</div><div class="actions"><a href="mocangli-2024plus-cards.html?q=${k}">${k} 全部思想卡 →</a></div></section>`}).join('')}).catch(()=>{document.getElementById('modules').innerHTML='<div class="loading">数据加载失败，请刷新页面。</div>'})</script></body></html>
