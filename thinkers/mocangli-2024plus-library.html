<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>墨苍离 2024+ · 核心思想分类库</title><style>:root{--bg:#f5f6f8;--card:#fff;--text:#17191c;--muted:#6b7280;--line:#e5e7eb;--soft:#f1f2f4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.75}a{color:inherit;text-decoration:none}.wrap{max-width:1080px;margin:auto;padding:28px 22px 90px}.top{display:flex;justify-content:space-between;gap:14px;font-size:13px;color:var(--muted)}.hero{padding:48px 0 24px}.eyebrow{font-size:12px;letter-spacing:.14em;font-weight:800;color:var(--muted)}h1{font-size:46px;line-height:1.1;margin:8px 0 12px}.lead{color:var(--muted);font-size:17px;max-width:900px}.status{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 22px}.status span{font-size:12px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 9px}.toc{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0 24px}.toc a{background:var(--soft);padding:6px 9px;border-radius:999px;font-size:12px}.module{background:#fff;border:1px solid var(--line);border-radius:20px;padding:25px;margin-top:12px;scroll-margin-top:18px}.num{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.12em}.module h2{font-size:26px;margin:5px 0}.one{font-size:17px;font-weight:800;margin:0 0 8px}.module p{margin:7px 0;color:#4b5563}.boundary{margin-top:12px;padding:12px 14px;background:var(--soft);border-radius:12px;font-size:13px;color:#4b5563}.subtopics{margin-top:16px;padding-top:15px;border-top:1px solid var(--line)}.subtopics h3{font-size:15px;margin:0 0 9px}.subgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.subtopic{position:relative;padding:12px 13px 42px;background:#fafafa;border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:.15s;min-height:108px}.subtopic:hover{transform:translateY(-1px);box-shadow:0 7px 18px rgba(0,0,0,.04)}.subtopic b{display:block;font-size:13px}.subtopic span.desc{display:block;font-size:11px;color:var(--muted);margin-top:3px}.count{position:absolute;left:12px;bottom:10px;font-size:11px!important;font-weight:750;background:var(--soft);padding:4px 7px;border-radius:999px}.count:hover{background:#17191c;color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions a{display:inline-block;background:#17191c;color:#fff;padding:7px 10px;border-radius:9px;font-size:12px;font-weight:750}.footer{margin-top:24px;color:var(--muted);font-size:12px}.loading{padding:50px;text-align:center;color:var(--muted)}@media(max-width:700px){h1{font-size:36px}.subgrid{grid-template-columns:1fr}.top{flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><a href="mocangli-2024plus.html">← 返回 2024+ 思想库</a><a href="mocangli-2024plus-map.html">思想关系图 →</a></div><header class="hero"><div class="eyebrow">LAYER 02 · CORE LIBRARY · SOURCE ONLY</div><h1>13个核心思想模块</h1><p class="lead">13个模块是主骨架；79个小主题是机制层；100张思想卡与原始回答构成证据层。现在三层已经正式连通：点主题进入机制页，点“相关卡”直接下钻到证据卡。</p></header><div id="status" class="status"><span>正在读取主题映射…</span></div><nav id="toc" class="toc"></nav><main id="modules"><div class="loading">正在生成分类库…</div></main><div class="footer">Source Only：所有模块、小主题、卡片与映射只使用本次 canglimo_2024plus 语料。主题归属属于研究性整理，不声称作者本人按此目录发表过完整理论。</div></div><script>const meta={M01:{n:'认知与信息加工',one:'认知不是知道多少，而是怎样感知、筛选、建模、预测和更新。',p:'从信息进入大脑，到模型形成，再到判断、行动和反馈，是这一模块的主链。',b:'不能把认知当万能解释；资源、制度位置和环境会反过来塑造认知。'},M02:{n:'系统、复杂性与不确定性',one:'复杂结果通常来自变量耦合、反馈和路径依赖，而不是唯一原因。',p:'系统思维的用途不是把问题说复杂，而是寻找关键变量、反馈环和可干预点。',b:'能用简单机制解释的问题，不应为了高级感过度建模。'},M03:{n:'概率决策与容错',one:'好的决策不只提高胜率，也要保证判断错了以后还在游戏里。',p:'概率、基础率、尾部风险、容错和止损共同构成这一模块。',b:'概率化不是伪精确；低概率毁灭性风险不能只用平均收益处理。'},M04:{n:'行动、试错与反馈',one:'行动的核心价值之一，是产生仅靠思考得不到的信息。',p:'试错是否值得，取决于可逆性、反馈速度和是否真的更新模型。',b:'“先干再说”只适用于试错成本可控的场景；持续行动不能替代方向判断。'},M05:{n:'主体性、独立与选择权',one:'主体性是形成判断、做决定、承担后果，并保留真实选择与退出能力。',p:'它既有心理层，也需要技能、现金、网络等现实底座。',b:'主体性不是任性，也不是拒绝外部建议。'},M06:{n:'关系、边界与合作博弈',one:'合作不是取消防御；长期关系要同时看互惠、成本、边界和退出能力。',p:'关系判断从“这个人是什么人”转向“长期互动结构会产生什么结果”。',b:'一次冲突或短期舒服都不足以定义关系质量，应观察长期模式。'},M07:{n:'情绪、焦虑与认知带宽',one:'情绪是信号，不是事实；真正要减少的是无信息增益的反刍。',p:'心理状态会改变注意力、概率感受、解释方式和行动能力。',b:'不能把所有心理问题都压成认知问题；身体、环境和专业干预同样重要。'},M08:{n:'概念、叙事与模因免疫',one:'高传播性的标签和金句会压缩现实，也会偷偷规定人的身份和行为。',p:'通过拆词、拆叙事、看传播机制，恢复被一句话抹掉的条件和灰度。',b:'祛魅不是为了否定一切，而是让概念重新接受现实检验。'},M09:{n:'价值、道德、正义与立场',one:'承认立场影响判断，同时保留事实层的证据程序和纠偏能力。',p:'事实、解释、价值、利益和情绪需要分层进入判断。',b:'承认立场不等于事实虚无；程序性求真仍然必要。'},M10:{n:'社会规则、权力与价值分配',one:'创造价值和获得价值之间，还隔着可见性、归因、稀缺性、议价与制度。',p:'理解组织和社会行为，要看激励、责任、网络位置与改变规则的成本。',b:'分析利益结构不是鼓励无底线博弈，规则和长期合作本身也是约束。'},M11:{n:'阶层、资源与环境约束',one:'很多“个人选择”发生在资源、网络、制度位置和环境可预测性的约束里。',p:'阶层更像多个变量长期耦合出的系统状态，而不是单一人格或认知结果。',b:'结构约束不等于个人完全无能为力；重点是区分可改变量与暂时不可改约束。'},M12:{n:'成长、成功与反成功学',one:'经历、苦难、努力和成功结果都不能自动证明能力真正增长。',p:'成长的核心是反馈进入模型并改变后续行为；成功则需要多因果解释。',b:'反成功学不是反对努力，而是反对从结果反推人格和万能方法。'},M13:{n:'自由、意义与生活设计',one:'祛魅之后不必走向虚无；自由与意义可以落在具体选择、关系和体验中。',p:'生活设计更关注自决、选项和局部真实意义，而不是寻找唯一正确人生。',b:'没有终极答案，不等于具体生活中的意义失去合法性。'}};const desc={"知识与认知":"信息、知识、认知、行动","信息筛选":"噪音、来源、样本、过滤成本","模型与压缩":"表象、生成规则、预测与迁移","元认知与自我校准":"去自媚、未知、外部校验","样本、反证与多视角":"最强反方、证伪、压力测试","认知到决策与行动":"判断、选择、反馈、长期校准","多因果与变量耦合":"资源、认知、网络、制度、随机性","反馈环":"自强化、自抑制与循环切断","路径依赖与局部最优":"锁定、转换成本、错误的山","非线性与涌现":"阈值、延迟、突变与互动","环境—认知耦合":"可预测性、注意力、长期模型","机制预测与人格标签":"角色、激励、成本与情境","概率化判断":"概率、收益、损失、更新","基础率与参照类":"先验、历史分布、特殊修正","预验尸与反事实":"提前假设失败、暴露盲点","容错结构":"现金、技能、健康、网络","尾部风险与不出局":"不可逆损失与长期生存","止损与外部选项":"沉没成本、退出、备用路径","行动产生信息":"真实约束、信息增益、实验","可逆性与试错边界":"回撤成本、不可逆选择","反馈与模型更新":"假设、行动、反馈、修正","持续交卷与盲目重复":"长期主义、方向、反馈质量","认知—行动鸿沟":"信息囤积、启动成本、实施","执行与战略方向":"方向、放大、探索、校准","主体性":"判断、决定、承担后果","独立思考":"来源、推理链、反证","选择权与退出权":"选择、不选择、退出","内生评价系统":"自我标准与反馈回路","外部选项与现实底座":"技能、现金、网络、地理","课题分离与责任边界":"控制边界、责任、后果","信任":"行为证据、冲突、边界测试","忠诚":"高成本场景、诱惑、责任","边界":"拒绝、后果、退出","依赖与退出":"外部选项、依附、重新开始","付出与价值感知":"互惠、成本感知、关系定价","婚姻筛选":"责任、诚实、冲突、风险","情绪是信号，不是事实":"信号、解释、行动","焦虑与灾难化":"概率失真、最坏情景、备用方案","反刍与有效处理":"信息增益与行动出口","认知带宽与决策负荷":"注意力、琐事、心理算力","外部评价、羞耻与自我攻击":"他评依赖、自我标签、控制感","环境设计与身体介入":"默认选项、感官、环境约束","抽象词与语义拆解":"定义、边界、可观察变量","自媚与自我叙事":"自我辩护、身份保护、无成本解释","祛魅":"去投射、去刻奇、回现实","身份标签与人格化解释":"角色、情境、机制替代标签","社会脚本与“应该”":"社会时钟、排名、身份要求","传播、平台与样本偏差":"算法、幸存者偏差、传播压缩","事实—解释—价值分层":"发生什么、为什么、如何评价","立场与生态位":"利益、位置、身份保护","利弊—道德—情绪":"现实候选、道德否决、情绪成本","善良与现实成本":"善意、边界、合作条件","正义与结果":"形式、约束、合作秩序","程序性求真与反方校验":"证据、反方、可检验性","价值创造与价值获得":"贡献、捕获、分配机制","可见性与归因权":"让贡献被看见并正确归因","稀缺性与议价权":"替代成本、外部选项、谈判","网络位置与权力拓扑":"节点、信息流、资源流","规则、激励与制度条件":"责任、奖励、惩罚、外部监督","重大利益与博弈优先级":"目标、成本、评价、情绪","资源缓冲":"现金流、失败承受力、时间","网络与弱连接":"异质信息、机会入口、跨圈层","制度位置":"身份、权限、资格、规则入口","环境可预测性":"长期规划、低熵、时间视野","注意力贫困":"琐碎决策、压力、长期投资能力","阶层路径锁定":"局部最优、转换成本、错误的山","阶层的多维状态":"认知、网络、资源、制度位置","苦难与成长":"复盘、转化、模型更新","失败与模型更新":"测试结果、反馈、去人格化","努力质量与“假努力”":"方向、位移、反馈、策略","成功的多因果与幸存者偏差":"时机、资本、网络、运气、选择偏差","职业成长与可迁移能力":"事务熟练、市场价值、迁移性","教育与自我重构":"提问、重构、元认知、同侪校验","自由与选择权":"选择、不选择、退出、自决","局部、具体而真实的意义":"关系、体验、目标、行动","异化与他人标准":"工具化、社会评价、自我丢失","普通人与内生幸福":"去排名、自定义目标、反馈","生活设计与选项":"多路径、可调整、现实选择空间","祛魅与虚无":"无终极意义≠无具体意义"};function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}fetch('mocangli-2024plus-topic-card-map.json').then(r=>r.json()).then(map=>{document.getElementById('status').innerHTML=`<span>13 个核心模块</span><span>${map.stats.topics} 个小主题</span><span>${map.stats.cards_primary_mapped}/100 卡片有主归属</span><span>${map.stats.topics_with_primary_or_related}/79 主题有证据卡连接</span>`;const by={};map.topics.forEach(t=>(by[t.module]||(by[t.module]=[])).push(t));document.getElementById('toc').innerHTML=Object.keys(meta).map(k=>`<a href="#${k.toLowerCase()}">${esc(meta[k].n.split('、')[0])}</a>`).join('');document.getElementById('modules').innerHTML=Object.entries(meta).map(([k,m])=>{const ts=by[k]||[];return `<section class="module" id="${k.toLowerCase()}"><div class="num">${k}</div><h2>${esc(m.n)}</h2><div class="one">${esc(m.one)}</div><p>${esc(m.p)}</p><div class="boundary">边界：${esc(m.b)}</div><div class="subtopics"><h3>${k} 下属小主题 · ${ts.length}/${ts.length} 已深化</h3><div class="subgrid">${ts.map(t=>{const n=(t.primary_cards||[]).length+(t.related_cards||[]).length;return `<div class="subtopic" onclick="location.href='${esc(t.page)}'"><b>${esc(t.title)}</b><span class="desc">${esc(desc[t.title]||'机制深化与证据边界')}</span><a class="count" href="mocangli-2024plus-cards.html?topic=${encodeURIComponent(t.key)}" onclick="event.stopPropagation()">相关卡 ${n} 张 →</a></div>`}).join('')}</div></div><div class="actions"><a href="mocangli-2024plus-cards.html?q=${k}">${k} 全部证据卡 →</a></div></section>`}).join('')}).catch(()=>{document.getElementById('modules').innerHTML='<div class="loading">主题映射加载失败，请刷新页面。</div>'})</script></body></html>
