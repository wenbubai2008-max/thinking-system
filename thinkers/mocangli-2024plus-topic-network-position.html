<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M10 · 网络位置与权力拓扑</title><style>body{margin:0;background:#f5f6f8;color:#17191c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8}.w{max-width:920px;margin:auto;padding:30px 22px 90px}a{color:inherit}.hero{padding:45px 0}.k{font-size:12px;color:#6b7280;font-weight:800;letter-spacing:.12em}h1{font-size:44px;margin:8px 0 12px}.lead{color:#6b7280}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;margin-top:12px}.card h2{margin:0 0 8px;font-size:24px}.card p{margin:6px 0;color:#4b5563}.src{font-size:12px;color:#6b7280;border-top:1px solid #e5e7eb;margin-top:14px;padding-top:12px}</style></head><body><div class="w"><a href="mocangli-2024plus-library.html#m10">← 返回 M10</a><div class="hero"><div class="k">M10 · M11 · SOURCE ONLY</div><h1>网络位置与权力拓扑</h1><p class="lead">同样的能力，处在不同网络位置，能调动的信息、资源和机会完全不同。</p></div><div class="card"><h2>核心机制</h2><p>权力不只来自职位，也来自连接结构：你连接哪些人、能否跨圈层、是否控制关键接口、别人绕开你的成本多高。</p></div><div class="card"><h2>为什么重要</h2><p>只看个人属性，会忽略“人在网络中的位置”本身就是资源。弱连接、跨层连接和关键节点都可能改变机会集合。</p></div><div class="card"><h2>边界</h2><p>网络位置不是万能。没有真实交换价值的关系，很难长期维持。</p><div class="src">主要证据：001772 · 2026-03-02 关于“成大事”的回答；001718 · 2026-03-13 关于阶层决定因素的回答。</div></div></div></body></html>
