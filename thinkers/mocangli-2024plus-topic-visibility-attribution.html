<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M10 · 可见性与归因权</title><style>body{margin:0;background:#f5f6f8;color:#17191c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8}.w{max-width:920px;margin:auto;padding:30px 22px 90px}a{color:inherit}.hero{padding:45px 0}.k{font-size:12px;color:#6b7280;font-weight:800;letter-spacing:.12em}h1{font-size:44px;margin:8px 0 12px}.lead{color:#6b7280}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;margin-top:12px}.card h2{margin:0 0 8px;font-size:24px}.card p{margin:6px 0;color:#4b5563}.src{font-size:12px;color:#6b7280;border-top:1px solid #e5e7eb;margin-top:14px;padding-top:12px}</style></head><body><div class="w"><a href="mocangli-2024plus-library.html#m10">← 返回 M10</a><div class="hero"><div class="k">M10 · SOURCE ONLY</div><h1>可见性与归因权</h1><p class="lead">如果贡献无法被识别、记录和归因，它在分配环节就可能被系统性折价。</p></div><div class="card"><h2>核心机制</h2><p>组织并不是自动知道“谁真正做了什么”。信息经过汇报、层级和叙事传递，贡献需要被记录、可验证并能被正确归因。</p></div><div class="card"><h2>为什么重要</h2><p>“埋头苦干”可能提高产出，却不一定提高分配。可见性并非虚荣，而是让真实贡献进入组织决策的信息系统。</p></div><div class="card"><h2>边界</h2><p>可见性不能替代真实能力；长期只靠包装而没有结果，同样会被反馈淘汰。</p><div class="src">主要证据：001508 · 2026-04-26；001772 · 2026-03-02 关于“成大事”的回答。</div></div></div></body></html>
