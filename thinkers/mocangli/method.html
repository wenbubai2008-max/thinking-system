7453341530972393/answer/1888286713803170224"],["003627","「祛魅」的本质是什么？不断暗示自己应该对理想化的感情「祛魅」、接受现实的不完美，这是正确的吗？","2024-10-03","https://www.zhihu.com/question/671400722/answer/4075486480"],["001663","自由 生命 爱 金钱 怎么排序?","2026-03-24","https://www.zhihu.com/question/665847507/answer/2019725202414674269"],["001693","如何理解「强者活在事情里，弱者活在情绪里」这句话？","2026-03-18","https://www.zhihu.com/question/2015715120517521696/answer/2017576999493871360"]]},"P02":{"name":"去自媚与中性自我建模","definition":"把“我是好人/强者/受害者/聪明人”等自我叙事降权，优先问发生了什么、机制是什么、自己能改什么。","moves":["识别自我高尚化","把道德评价改为行为描述","检查羞耻/面子是否污染感知","允许自己不是故事里的正义主角"],"anti":"不是自我贬低，而是减少自我形象对事实处理的干扰。","evidence":[["004465","怎么提高自己的认知能力？","2024-04-01","https://www.zhihu.com/question/318788666/answer/3450968270"],["002581","苦难经历对成长的「价值」，是真相还是自我安慰？","2025-06-26","https://www.zhihu.com/question/1920997349217505961/answer/1921581841418290828"],["001563","男方父亲坚决反对结婚，已分手。男方是理性决策，还是懦弱没担当？女方家有无问题？男方家长说女孩不聪明？","2026-04-14","https://www.zhihu.com/question/2026086569941935665/answer/2027442422003540906"],["003870","为什么我总是会想活着的意义呢？","2024-08-01","https://www.zhihu.com/question/660409026/answer/3581020826"]]},"P03":{"name":"从线性因果切换到系统模型","definition":"面对复杂问题，不寻找单一“决定因素”，而观察变量耦合、反馈环、阈值、环境和制度位置。","moves":["画因果环","找正负反馈","识别局部最优","寻找阈值/临界点","区分个体变量和结构变量"],"anti":"不是把所有问题都复杂化；模型必须能提升解释或决策，否则只是术语堆叠。","evidence":[["004465","怎么提高自己的认知能力？","2024-04-01","https://www.zhihu.com/question/318788666/answer/3450968270"],["004242","如何更好地颠覆自己旧有的认知、重塑三观？","2024-05-19","https://www.zhihu.com/question/655914792/answer/3502922788"],["001718","什么决定一个人的阶层？","2026-03-13","https://www.zhihu.com/question/2015733415299786058/answer/2015869476806079820"],["001750","为什么很多人明明很努力，却始终无法跨越阶层？是认知的局限，还是人性的弱点？","2026-03-07","https://www.zhihu.com/question/2011580691641561090/answer/2013557802816255338"]]},"P04":{"name":"概率化与灰度化","definition":"把“肯定/必然/对错”改写成基础率、区间概率、条件概率和可更新判断。","moves":["基础率","贝叶斯更新","反事实","概率链相乘","预先止损","给判断保留“不知道”"],"anti":"不是取消判断，而是让判断带置信度和更新入口。","evidence":[["002288","在日常生活中，我们如何更有效地识别和避免认知偏差对决策的影响？","2025-09-13","https://www.zhihu.com/question/1947059093459140903/answer/1950281081954731121"],["002247","人的一生容错率真的很大吗?","2025-09-25","https://www.zhihu.com/question/1923372470221641356/answer/1954527386289837971"],["003016","如何解决自己的焦虑不安？","2025-03-31","https://www.zhihu.com/question/1887659195458881492/answer/1890172855494353065"],["001588","你认为政治立场重要还是尊重客观事实重要？","2026-04-10","https://www.zhihu.com/question/2012119188030911886/answer/2025878560368338649"]]},"P05":{"name":"样本、证伪与多视角","definition":"不靠单个故事确认世界观，主动引入反例、异见、不同阶层/角色样本，检验模型的解压和预测能力。","moves":["找反例","steelman反方","扩大样本","跨环境观察","决策日志复盘"],"anti":"不是机械“各打五十大板”，而是提高模型对异常样本的解释力。","evidence":[["004242","如何更好地颠覆自己旧有的认知、重塑三观？","2024-05-19","https://www.zhihu.com/question/655914792/answer/3502922788"],["002288","在日常生活中，我们如何更有效地识别和避免认知偏差对决策的影响？","2025-09-13","https://www.zhihu.com/question/1947059093459140903/answer/1950281081954731121"],["001588","你认为政治立场重要还是尊重客观事实重要？","2026-04-10","https://www.zhihu.com/question/2012119188030911886/answer/2025878560368338649"],["001844","对于一个孩子来说什么是最好的教育？","2026-02-15","https://www.zhihu.com/question/310746111/answer/2006161183523247918"]]},"P06":{"name":"成本—收益—机会成本化","definition":"将“爱不爱、勇不勇敢、公不公平、值不值得”等问题翻译成谁付成本、获得什么、替代方案是什么、机会成本是什么。","moves":["显性化成本","区分沉没成本与未来成本","比较替代方案","识别无成本表态","分析激励与收益"],"anti":"不是把一切货币化；成本包括时间、精力、信任、健康、关系和未来可能性。","evidence":[["001563","男方父亲坚决反对结婚，已分手。男方是理性决策，还是懦弱没担当？女方家有无问题？男方家长说女孩不聪明？","2026-04-14","https://www.zhihu.com/question/2026086569941935665/answer/2027442422003540906"],["001714","立场重要，还是是非重要？","2026-03-14","https://www.zhihu.com/question/1987986730356323555/answer/2016211815957308108"],["002247","人的一生容错率真的很大吗?","2025-09-25","https://www.zhihu.com/question/1923372470221641356/answer/1954527386289837971"],["001508","这个社会为什么大部分老实人都混得不好？","2026-04-26","https://www.zhihu.com/question/646058976/answer/2031818898400596451"]]},"P07":{"name":"行动产生信息","definition":"当试错成本可控时，不把“完全想清楚”当行动前提；用小步行动获得只在现实交互中出现的信息。","moves":["降低启动能垒","最小可行试验","加快反馈","行动后复盘","高成本不可逆决策先想"],"anti":"不是“无脑干”；持续低质量重复本身没有价值。","evidence":[["003258","认知太高但年龄太小，「行动跟不上思维」该怎么办？","2025-01-30","https://www.zhihu.com/question/9644574539/answer/89731847991"],["002491","普通人需要提升认知，还是需要提升执行力？","2025-07-17","https://www.zhihu.com/question/1926171484868572060/answer/1929322035517039385"],["001903","普通人该如何打破行动跟不上认知的僵局？","2026-01-24","https://www.zhihu.com/question/1968047655893578106/answer/1998462468121461298"],["001662","为什么多数人困在「先想清楚再行动」的思维陷阱里？忘了所有突破性创新都始于「干起来再调整」的循环？","2026-03-24","https://www.zhihu.com/question/1986706085122420806/answer/2019763587137184101"],["001732","杨迪分享「持续交卷」理念，称人生持续交卷就会有成绩，这是一种怎样的行动哲学？给我们带来哪些启示？","2026-03-10","https://www.zhihu.com/question/2014471214588977634/answer/2014774397995610824"]]},"P08":{"name":"外部化与环境设计","definition":"不要把稳定表现寄托在线性意志力上，把决策、注意力、记录、工具、社交环境和默认选项设计成系统。","moves":["记录决策","建立模板","降低好行为启动成本","提高干扰启动成本","用环境代替意志硬扛"],"anti":"不是取消个人责任，而是承认人的认知资源有限。","evidence":[["002189","你对于维持心理健康有什么极简建议？","2025-10-12","https://www.zhihu.com/question/1939226354475341308/answer/1960828612254085914"],["003016","如何解决自己的焦虑不安？","2025-03-31","https://www.zhihu.com/question/1887659195458881492/answer/1890172855494353065"],["001903","普通人该如何打破行动跟不上认知的僵局？","2026-01-24","https://www.zhihu.com/question/1968047655893578106/answer/1998462468121461298"],["001512","普通家庭的孩子，如何靠自己跨越阶层？","2026-04-26","https://www.zhihu.com/question/1913065377237280660/answer/2031727062105507818"]]},"P09":{"name":"区分事实—解释—价值","definition":"同一事件中分开“发生了什么”“为什么会发生”“我认为它应该怎样”，并承认立场会影响解释。","moves":["先陈述事实","标记解释层","标记价值层","承认立场","寻找最强反方"],"anti":"不是宣称价值中立可以彻底实现，而是建立纠偏程序。","evidence":[["001588","你认为政治立场重要还是尊重客观事实重要？","2026-04-10","https://www.zhihu.com/question/2012119188030911886/answer/2025878560368338649"],["001714","立场重要，还是是非重要？","2026-03-14","https://www.zhihu.com/question/1987986730356323555/answer/2016211815957308108"],["001775","正义和立场哪个重要?","2026-03-01","https://www.zhihu.com/question/1935287463351410928/answer/2011427931365336527"]]},"P10":{"name":"从
