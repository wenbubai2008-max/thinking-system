<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>墨苍离 · 核心思想</title><style>:root{--bg:#f6f7f8;--card:#fff;--text:#181a1d;--muted:#6d737c;--line:#e1e4e8;--soft:#f1f3f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.75}a{color:inherit;text-decoration:none}.wrap{max-width:1000px;margin:auto;padding:30px 22px 90px}.top{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:20px}.hero,.section{background:#fff;border:1px solid var(--line);border-radius:18px}.hero,.section{padding:30px}.section{margin-top:15px}.hero h1{font-size:40px;margin:6px 0}.kicker{font-size:12px;font-weight:850;color:var(--muted);letter-spacing:.1em}.thesis{background:var(--soft);padding:15px 17px;border-radius:12px;font-size:18px;font-weight:800}.list{padding-left:22px}.list li{margin:7px 0}.tags{display:flex;flex-wrap:wrap;gap:7px}.tag{background:var(--soft);padding:5px 9px;border-radius:999px;font-size:12px}.warn{border-left:4px solid #888;background:#fafafa;padding:12px 14px;border-radius:8px}.sources{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);font-size:13px}@media(max-width:700px){.wrap{padding:18px 14px 60px}.hero,.section{padding:20px}.hero h1{font-size:32px}}</style></head><body><div class="wrap"><div class="top"><a href="../mocangli.html">← 返回墨苍离思想体系</a><span>核心思想详细页</span></div><div id="app"></div></div><script>const D={"M01":{"n":"认知与信息加工","t":"认知不是知识存量，而是感知、筛选、建模、预测、元认知校准并驱动决策的整体信息处理能力。","c":["信息不等于知识，知识不等于认知，认知不等于行动。","信息传递会因语言带宽、传播链和既有框架发生损耗与扭曲。","高认知的关键不只是知道更多，而是用更低复杂度的模型解释并预测更多现象，同时允许模型被异常样本修正。","真正的认知优势包含知道自己不知道什么，并能借用他人、环境和工具补盲区。"],"u":["信息源分级","样本扩展","模型抽取","预测检验","元认知复盘","默会知识实践"],"m":["不能简化为“学历低=认知低”。","不能把“认知=压缩”绝对化；相关长文自己明确这只是一个视角。"],"s":["004299","004465","003583","004242","002862","000937","001756","001580","001752"]},"M02":{"n":"系统、复杂性与不确定性","t":"现实中的人生、阶层、组织和关系多为非线性系统；单变量解释和确定性答案通常会损失关键结构。","c":["复杂问题应看变量耦合、反馈环、吸引子、阈值和环境。","确定性本身稀缺且昂贵；很多决策必须在信息不完备下进行。","模型价值在于有用与可更新，而不是声称完整复制现实。","局部最优可能把人锁在错误路径上，环境变化还会改变“山峰高度”。"],"u":["因果回路","情景树","阈值判断","多路径备选","持续校准"],"m":["不是“越复杂越高级”；如果一个模型不能改善判断，就可能只是术语化。"],"s":["003479","004242","001718","001750","001467"]},"M03":{"n":"概率决策与容错","t":"人生质量更接近大量决策概率的长期累积，而非单次“押对”；因此应同时提升胜率、控制下行、保留再下注能力。","c":["二元判断应改成概率区间和可更新判断。","重大选择需要考虑基础率、长期损益、沉没成本和不可逆性。","容错率来自多赛道、多地缘、时间、技能、资金和社会网络所构成的选择空间。","止损的本质不是认输，而是阻止过去成本继续绑架未来选择。"],"u":["概率链","决策日志","预承诺止损","10-10-10时间尺度","备案/安全垫","反向灯塔"],"m":["概率主义不是冷漠，也不是“任何事都不确定所以不用判断”。"],"s":["002288","002798","002247","003016","001522","000453"]},"M04":{"n":"行动、试错与反馈","t":"行动不是认知的对立面；在低试错成本领域，行动本身是获取信息的手段，但行动必须带反馈、校准和停止条件。","c":["“想清楚再做”和“先做再调”由试错成本与不可逆性决定。","很多行动障碍不是缺道理，而是启动能垒、环境、羞耻和反复重新决策造成的。","低水平重复不会因“持续交卷”自动变成成长。","有效行动应提高反馈速度、迭代质量和方向校准频率。"],"u":["最小行动","if-then执行","环境设计","过程指标","复盘","停止条件"],"m":["不是执行力崇拜；认知不足时，高频执行可能只是高效率地走错路。"],"s":["003258","002491","001903","001662","001732","001750"]},"M05":{"n":"主体性、独立与选择权","t":"一个人的主体性体现在能形成自己的判断、承担选择后果，并拥有拒绝、离开和重新选择的真实能力。","c":["独立不是“不听劝”，而是不把他人的评价直接当作自己的决策函数。","没有资源、技能、社会网络等外部选项时，很多“边界”只是情绪表达。","好的关系和教育应增强主体性，而不是让人更依赖、更窄、更不敢做决定。","自由更适合拆成具体的选择权、不选择权和退出能力，而非抽象口号。"],"u":["课题分离","水密舱式生活结构","外部选项","经济/技能独立","边界与拒绝练习"],"m":["主体性不是自我中心，也不是拒绝合作；相关回答专门区分了“自我”和“主体性”。"],"s":["003541","004516","002105","002292","002799","001815","001508","001663"]},"M06":{"n":"关系、边界与合作博弈","t":"高质量关系不是无条件融合，而是两个有主体性的个体在边界清晰、信息双向、能互惠也能惩罚背叛的条件下长期合作。","c":["“滋养”可看作主体性、能力和世界范围的扩张；“消耗”相反。","善良与可信任不等于无条件满足；长期合作需要识别、记忆、互惠和对搭便车者的后果。","人际欺负常通过低成本试探逐步确认，而不是“一眼识别弱者”。","亲密关系应关注核心认知兼容、需求表达、冲突模式、算力是否互补，而不只看浪漫强度。"],"u":["小样本观察","冲突复盘","边界测试","互惠原则","记录与证据","退出能力"],"m":["不是鼓励犬儒或“所有关系都是利用”；语料同时强调高信任合作的长期收益。"],"s":["003421","002174","003096","001813","001815","000938","000473"]},"M07":{"n":"情绪、焦虑与认知带宽","t":"情绪不是弱者标志，也不是应被消灭的噪声；关键是识别其信息价值，减少反刍和无意义决策对有限认知带宽的占用。","c":["情绪可区分为携带新信息的信号与无新增信息的反刍。","焦虑常被灾难化、全或无、应然命令、身份标签和概率失真放大。","大量无关紧要的微决策、猜疑和自检会耗尽关键问题所需的算力。","具体行动、环境调整、记录与模板化可以缩短情绪处理链路。"],"u":["情绪标记","概率拆解","决策模板","注意力审计","具体任务","安全垫"],"m":["不是“忙起来就能治所有心理问题”；部分回答明确在持续或影响功能时应寻求专业/医疗帮助。"],"s":["003843","004596","003016","003198","002189","001693"]},"M08":{"n":"概念、叙事与模因免疫","t":"大量社会争论和自我痛苦来自模糊大词、标签、社会脚本和传播效率高但信息密度低的“废话道理”；需要把叙事拆回机制。","c":["“强者/弱者”“过度努力”“理想爱情”等标签会借二元分类、羞耻或刻奇劫持判断。","祛魅不是否定美好，而是挤掉投射、刻奇和不现实预期。","社会时钟与宏大叙事会把群体默认路径伪装成个人唯一答案。","语言既是思考工具，也可能放大虚无、焦虑和自我标签。"],"u":["语义拆词","反例检验","情绪狗哨识别","社会脚本识别","表征→机制转换"],"m":["不是“所有共识都是骗局”，而是要求共识接受机制和样本检验。"],"s":["003627","003031","002580","002799","002944","001693","002302"]},"M09":{"n":"价值、道德、正义与立场","t":"价值判断无法完全脱离立场和生态位，但仍应通过事实/解释/价值分层、反方检验和成本分析减少自我正义化。","c":["道德词不应直接替代事实和因果分析。","善良若没有边界、后果和拒绝能力，容易变成可被调用的低摩擦资源。","面对立场冲突，应先承认自己的位置，再区分事实、解释和价值。","正义是多维度的，程序、分配、承认、修复等维度可能互相冲突。"],"u":["事实-解释-价值三层","steelman反方","利弊→道德→情绪的次序","情景化正义分析"],"m":["语料内部存在张力：部分回答更强调“是非受立场生成”，另一些明确坚持客观事实与价值层应尽量区分。不能压成“没有客观事实”。"],"s":["004134","003812","002362","002756","001588","001714","001775","001508"]},"M10":{"n":"社会规则、权力与价值分配","t":"创造价值与获得价值是两套机制；回报还受可见性、归因、稀缺性、议价力、网络位置、规则和替代性影响。","c":["社会常把额外任务流向边界最低、拒绝成本最低的人。","真实贡献如果不可见、不可归因，可能长期被低估或被他人占用。","边界需要证据、替代方案和外部选项支撑。","规则应被看作约束和博弈地形，不宜神圣化，也不等于可以违法。"],"u":["利益链条","权力拓扑","归因权","议价力","证据记录","替代性建设"],"m":["不是“厚黑学”；核心是让真实贡献不被无偿占用，并保留制度/组织改善的结构视角。"],"s":["004097","002451","003096","001508","001772","001803"]},"M11":{"n":"阶层、资源与环境约束","t":"阶层不是单一收入变量，而是认知模式、社会网络、资源存量、制度位置、环境可预测性等耦合后的稳定状态；个体努力受此地形约束。","c":["努力可能只是在当前规则系统内逼近局部最优。","社会网络不仅是“人脉”，也是信息基础设施和机会可见性的边界。","稀缺、动荡和高不确定环境会占用认知带宽、提高短期折扣并削弱长时程规划。","注意力管理是改善处境的必要条件之一，但绝非跨阶层的充分条件。"],"u":["阶层状态诊断","弱连接扩展","资源冗余","注意力释放","规则系统切换","制度位置识别"],"m":["不能简化为“穷是因为认知低”；多个长文明确反对这种单向因果。"],"s":["004131","002433","001750","001718","001512","001467"]},"M12":{"n":"成长、成功与反成功学","t":"成长来自模型更新和能力结构变化，成功则是能力、路径、系统、时机、资源与运气共同作用的结果；不能用结果倒推人格和方法正确。","c":["苦难本身不产生成长，能更新模型的复盘才可能产生价值。","成功者的性格特征存在幸存者偏差和结果偏差，同一缺点成功后会被重新命名为优点。","努力要看方向、规则系统和边际回报，战术勤奋可能掩盖战略错误。","经验不会自动让人成熟，只有能修正预测模型的经验才有累积价值。"],"u":["反幸存者检查","过程指标","局部最优诊断","复盘","方向校准","运气/结构项单列"],"m":["不是否定努力，而是否定“努力天然值得且必然转化为结果”的道德化叙事。"],"s":["003719","003031","002581","001505","001576","001750","000940"]},"M13":{"n":"自由、意义与生活设计","t":"不追求一个能给整个人生盖章的终极答案，而把自由和意义还原到具体处境、体验、责任、关系、项目和可承担的选择中。","c":["抽象价值无法简单排名，它们构成动态系统，优先级随阶段和处境改变。","被外界评价长期驱动的“工具人”容易失去自我体验，从而反复追问意义。","宏观终极意义可以不可知，但这不否定中观制度改善和微观生活体验的意义。","自由应体现为真实可执行的选择、拒绝、退出及承担后果的能力。"],"u":["宏观/中观/微观分层","抽象词具体化","体验回归","具体任务","选择权盘点"],"m":["不是虚无主义；后期文本明确批评用“无终极意义”抹杀具体意义。"],"s":["003870","002302","001663","000474"]}};const id=new URLSearchParams(location.search).get('id')||'M01',d=D[id];if(!d){app.innerHTML='<section class="hero"><h1>未找到条目</h1></section>'}else{document.title=d.n+' · 墨苍离';app.innerHTML=`<section class="hero"><div class="kicker">${id} · 核心思想</div><h1>${d.n}</h1><div class="thesis">${d.t}</div></section><section class="section"><h2>稳定子命题</h2><ul class="list">${d.c.map(x=>`<li>${x}</li>`).join('')}</ul></section><section class="section"><h2>语料中反复使用的工具</h2><div class="tags">${d.u.map(x=>`<span class="tag">${x}</span>`).join('')}</div></section><section class="section"><h2>避免误读</h2>${d.m.map(x=>`<div class="warn" style="margin-top:8px">${x}</div>`).join('')}</section><section class="section"><h2>代表材料编号</h2><p class="sources">${d.s.join(' · ')}</p><p style="color:var(--muted)">原问题、日期与链接以原始语料库为准。</p></section>`}</script></body></html>
