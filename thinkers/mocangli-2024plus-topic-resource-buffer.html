<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M11 · 资源缓冲</title><style>body{margin:0;background:#f5f6f8;color:#17191c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8}.w{max-width:920px;margin:auto;padding:30px 22px 90px}a{color:inherit}.hero{padding:45px 0}.k{font-size:12px;color:#6b7280;font-weight:800;letter-spacing:.12em}h1{font-size:44px;margin:8px 0 12px}.lead{color:#6b7280}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;margin-top:12px}.card h2{margin:0 0 8px;font-size:24px}.card p{margin:6px 0;color:#4b5563}.src{font-size:12px;color:#6b7280;border-top:1px solid #e5e7eb;margin-top:14px;padding-top:12px}</style></head><body><div class="w"><a href="mocangli-2024plus-library.html#m11">← 返回 M11</a><div class="hero"><div class="k">M11 · M03 · SOURCE ONLY</div><h1>资源缓冲</h1><p class="lead">资源的价值之一，是把一次失败从“人生锁死”降级成“局部损失”。</p></div><div class="card"><h2>核心机制</h2><p>现金、住房、健康、技能和家庭支持会改变人能承受多大的波动。资源越薄，越需要优先保证现金流和短期安全，长期投资能力也越弱。</p></div><div class="card"><h2>为什么重要</h2><p>很多看似“保守”的选择，其实是可承受风险不同；不能脱离资源底座只评价个人勇气。</p></div><div class="card"><h2>边界</h2><p>资源多不自动等于判断好，但它会扩大试错空间和未来选项。</p><div class="src">主要证据：002247 · 2025-09-25《人的一生容错率真的很大吗？》；000472 · 2026-07-21。</div></div></div></body></html>
