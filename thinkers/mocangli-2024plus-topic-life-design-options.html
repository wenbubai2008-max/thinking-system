<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M13 · 生活设计与选项</title><style>body{margin:0;background:#f5f6f8;color:#17191c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8}.w{max-width:920px;margin:auto;padding:30px 22px 90px}a{color:inherit}.hero{padding:45px 0}.k{font-size:12px;color:#6b7280;font-weight:800;letter-spacing:.12em}h1{font-size:44px;margin:8px 0 12px}.lead{color:#6b7280}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;margin-top:12px}.card h2{margin:0 0 8px;font-size:24px}.card p{margin:6px 0;color:#4b5563}.src{font-size:12px;color:#6b7280;border-top:1px solid #e5e7eb;margin-top:14px;padding-top:12px}</style></head><body><div class="w"><a href="mocangli-2024plus-library.html#m13">← 返回 M13</a><div class="hero"><div class="k">M13 · M03/M05 · SOURCE ONLY</div><h1>生活设计与选项</h1><p class="lead">与其寻找唯一正确人生，不如持续增加可选择、可退出、可重来的空间。</p></div><div class="card"><h2>核心机制</h2><p>多技能、多路径、现金缓冲、外部网络和地理弹性，会把人生从单线押注变成可调整的组合。</p></div><div class="card"><h2>为什么重要</h2><p>选项本身有价值，因为未来信息总是不完整。保留选项，就是承认未来的自己可能知道得更多。</p></div><div class="card"><h2>边界</h2><p>保留选项不等于永远不承诺；某些关系和事业需要主动关闭部分选项，关键是知道自己换来了什么。</p><div class="src">主要证据：002247 · 2025-09-25 关于容错率；001663 · 2026-03-24 关于自由与选择权。</div></div></div></body></html>
