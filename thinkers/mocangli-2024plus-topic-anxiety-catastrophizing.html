<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M07 · 焦虑与灾难化</title><style>body{margin:0;background:#f5f6f8;color:#17191c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8}.w{max-width:920px;margin:auto;padding:30px 22px 90px}a{color:inherit}.hero{padding:45px 0}.k{font-size:12px;color:#6b7280;font-weight:800;letter-spacing:.12em}h1{font-size:44px;margin:8px 0 12px}.lead{color:#6b7280}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;margin-top:12px}.card h2{margin:0 0 8px;font-size:24px}.card p{margin:6px 0;color:#4b5563}.src{font-size:12px;color:#6b7280;border-top:1px solid #e5e7eb;margin-top:14px;padding-top:12px}</style></head><body><div class="w"><a href="mocangli-2024plus-library.html#m07">← 返回 M07</a><div class="hero"><div class="k">M07 · SOURCE ONLY</div><h1>焦虑与灾难化</h1><p class="lead">焦虑常把“可能发生”偷换成“马上会发生，而且我承受不了”。</p></div><div class="card"><h2>核心机制</h2><p>相关语料反复拆出灾难化、非黑即白、“应该”式自我逼迫、概率放大、负面筛选和身份化归因。焦虑不是一个单一变量，而是多种判断偏差与现实风险叠加后的状态。</p></div><div class="card"><h2>处理路径</h2><p>把最坏结果具体化，估计概率，列替代路径，建立安全垫，再区分“现实危险”与“脑内模拟”。</p></div><div class="card"><h2>边界</h2><p>不是所有焦虑都能靠认知重构解决；长期严重影响睡眠、工作和生活时，原文也保留了环境调整和专业医疗的边界。</p><div class="src">主要证据：003016 · 2025-03-31 关于焦虑不安的回答。</div></div></div></body></html>
