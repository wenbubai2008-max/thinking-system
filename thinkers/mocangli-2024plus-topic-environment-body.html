<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M07 · 环境设计与身体介入</title><style>body{margin:0;background:#f5f6f8;color:#17191c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8}.w{max-width:920px;margin:auto;padding:30px 22px 90px}a{color:inherit}.hero{padding:45px 0}.k{font-size:12px;color:#6b7280;font-weight:800;letter-spacing:.12em}h1{font-size:44px;margin:8px 0 12px}.lead{color:#6b7280}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;margin-top:12px}.card h2{margin:0 0 8px;font-size:24px}.card p{margin:6px 0;color:#4b5563}.src{font-size:12px;color:#6b7280;border-top:1px solid #e5e7eb;margin-top:14px;padding-top:12px}</style></head><body><div class="w"><a href="mocangli-2024plus-library.html#m07">← 返回 M07</a><div class="hero"><div class="k">M07 · SOURCE ONLY</div><h1>环境设计与身体介入</h1><p class="lead">有些情绪问题，不值得继续在脑内解释，先改变身体和环境反而更有效。</p></div><div class="card"><h2>核心机制</h2><p>语料并不把所有心理困扰都归因于认知。睡眠、运动、感官刺激、空间、现金安全垫、环境可预测性都会影响情绪系统。</p></div><div class="card"><h2>为什么有用</h2><p>环境外部化能减少大脑持续警戒；身体介入则可能直接改变唤醒水平，让后续认知处理重新可用。</p></div><div class="card"><h2>边界</h2><p>不是用“出去走走”替代真正问题。它更像先恢复处理能力，再继续做风险判断和现实行动。</p><div class="src">主要证据：003016 · 2025-03-31 焦虑不安相关回答；002189 · 2025-10-12 心理健康极简建议。</div></div></div></body></html>
