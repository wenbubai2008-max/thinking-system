<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M13 · 异化与他人标准</title><style>body{margin:0;background:#f5f6f8;color:#17191c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8}.w{max-width:920px;margin:auto;padding:30px 22px 90px}a{color:inherit}.hero{padding:45px 0}.k{font-size:12px;color:#6b7280;font-weight:800;letter-spacing:.12em}h1{font-size:44px;margin:8px 0 12px}.lead{color:#6b7280}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;margin-top:12px}.card h2{margin:0 0 8px;font-size:24px}.card p{margin:6px 0;color:#4b5563}.src{font-size:12px;color:#6b7280;border-top:1px solid #e5e7eb;margin-top:14px;padding-top:12px}</style></head><body><div class="w"><a href="mocangli-2024plus-library.html#m13">← 返回 M13</a><div class="hero"><div class="k">M13 · M05 · SOURCE ONLY</div><h1>异化与他人标准</h1><p class="lead">当人生长期只是完成别人定义的任务，意义焦虑会越来越像“我究竟在替谁活”。</p></div><div class="card"><h2>核心机制</h2><p>父母期待、社会排名、职业模板和外部认可会把人变成执行工具。即使完成很多目标，也可能缺乏“这是我自己决定的”体验。</p></div><div class="card"><h2>恢复方式</h2><p>重新区分外部要求和自身目标，把评价权、选择权和体验权逐步收回来。</p></div><div class="card"><h2>边界</h2><p>不是拒绝责任或社会合作，而是避免人生目标完全由外部系统定义。</p><div class="src">主要证据：003870 · 2024-08-01 关于“为什么会想活着的意义”的回答。</div></div></div></body></html>
