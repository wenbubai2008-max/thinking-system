<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M11 · 注意力贫困</title><style>body{margin:0;background:#f5f6f8;color:#17191c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8}.w{max-width:920px;margin:auto;padding:30px 22px 90px}a{color:inherit}.hero{padding:45px 0}.k{font-size:12px;color:#6b7280;font-weight:800;letter-spacing:.12em}h1{font-size:44px;margin:8px 0 12px}.lead{color:#6b7280}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;margin-top:12px}.card h2{margin:0 0 8px;font-size:24px}.card p{margin:6px 0;color:#4b5563}.src{font-size:12px;color:#6b7280;border-top:1px solid #e5e7eb;margin-top:14px;padding-top:12px}</style></head><body><div class="w"><a href="mocangli-2024plus-library.html#m11">← 返回 M11</a><div class="hero"><div class="k">M11 · M07 · SOURCE ONLY</div><h1>注意力贫困</h1><p class="lead">资源不足不仅减少钱，也会持续占用用于长期规划的注意力。</p></div><div class="card"><h2>核心机制</h2><p>现金焦虑、家庭冲突、即时生存、低质量信息等“注意力黑洞”会消耗有限认知带宽，让长期学习和规划越来越困难。</p></div><div class="card"><h2>为什么重要</h2><p>这能解释部分“知道应该长期规划，却总做不到”的现象：不是信息不足，而是处理资源被短期问题持续占用。</p></div><div class="card"><h2>边界</h2><p>注意力是必要条件，不是充分条件。结构性机会、制度和真实资源仍然决定可行动范围。</p><div class="src">主要证据：001512 · 2026-04-26 关于普通家庭实现阶层跃迁的回答。</div></div></div></body></html>
