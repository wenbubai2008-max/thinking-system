<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M11 · 制度位置</title><style>body{margin:0;background:#f5f6f8;color:#17191c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8}.w{max-width:920px;margin:auto;padding:30px 22px 90px}a{color:inherit}.hero{padding:45px 0}.k{font-size:12px;color:#6b7280;font-weight:800;letter-spacing:.12em}h1{font-size:44px;margin:8px 0 12px}.lead{color:#6b7280}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;margin-top:12px}.card h2{margin:0 0 8px;font-size:24px}.card p{margin:6px 0;color:#4b5563}.src{font-size:12px;color:#6b7280;border-top:1px solid #e5e7eb;margin-top:14px;padding-top:12px}</style></head><body><div class="w"><a href="mocangli-2024plus-library.html#m11">← 返回 M11</a><div class="hero"><div class="k">M11 · SOURCE ONLY</div><h1>制度位置</h1><p class="lead">同样的认知和努力，站在不同制度位置，可调用的资源和规则完全不同。</p></div><div class="card"><h2>核心机制</h2><p>职位、产权、资格、组织层级和正式权利，会决定一个人可以合法调用什么资源、参与哪些分配、获得多少信息。</p></div><div class="card"><h2>为什么重要</h2><p>如果只谈个人认知，会漏掉制度位置本身的杠杆；有些跃迁不是“想得更明白”，而是进入了新的规则系统。</p></div><div class="card"><h2>边界</h2><p>这是后期阶层模型中的重要维度，但不应被单独升级成决定一切的变量。</p><div class="src">主要证据：001718 · 2026-03-13 关于“什么决定阶层”的回答。</div></div></div></body></html>
