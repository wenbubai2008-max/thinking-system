ar(--muted);font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{font-size:42px;letter-spacing:-.04em;line-height:1.15;margin:8px 0 12px}.lead{font-size:17px;color:var(--muted);max-width:850px}.axis{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:22px 0 4px}.axis span{background:var(--soft);padding:6px 11px;border-radius:999px;font-size:13px;font-weight:700}.axis b{color:var(--muted)}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.stat{border:1px solid var(--line);background:var(--panel2);padding:10px 13px;border-radius:12px;font-size:13px}.stat strong{font-size:18px;margin-right:5px}.chapter{display:none;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:34px 38px;box-shadow:var(--shadow);margin-bottom:20px}.chapter.active{display:block}.chapter-head{display:flex;gap:18px;align-items:flex-start}.chapter-num{font-size:13px;font-weight:900;color:var(--muted);background:var(--soft);padding:7px 10px;border-radius:9px;margin-top:5px}h2{font-size:30px;line-height:1.25;margin:0 0 4px;letter-spacing:-.02em}.kicker{margin:0;color:var(--muted)}.summary{font-size:17px;margin:24px 0}.points{display:grid;grid-template-columns:1fr 1fr;gap:12px}.point{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:17px 18px}.point h4{margin:0 0 5px;font-size:16px}.point p{margin:0;color:var(--muted);font-size:14px}.callout{margin-top:18px;border-left:4px solid var(--accent);background:var(--panel2);padding:15px 17px;border-radius:10px}.section{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:34px 38px;box-shadow:var(--shadow);margin-bottom:20px}.section h2{margin-bottom:10px}.section p{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:17px}.card h3{margin:0 0 6px;font-size:17px}.card p{margin:0;font-size:14px;color:var(--muted)}.mobile-top{display:none}.hidden{display:none!important}@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:30;left:0;top:0;width:86vw;max-width:330px;transform:translateX(-105%);transition:.2s;box-shadow:0 0 40px rgba(0,0,0,.2)}.sidebar.open{transform:none}.mobile-top{display:flex;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);padding:10px 14px;border-bottom:1px solid var(--line);justify-content:space-between;align-items:center}.main{padding:18px 14px 60px}.hero,.chapter,.section{padding:24px 20px;border-radius:17px}h1{font-size:31px}h2{font-size:24px}.points,.grid{grid-template-columns:1fr}}

<script>
const DATA={
 mature:{
  title:'墨苍离 2024+ 思想框架',desc:'成熟期的核心从单纯的社会博弈，进一步系统化为：认知工程、叙事工程、行动工程、关系结构、概率主义与选择权。',axis:['现实与认知','叙事与自我','行动与反馈','关系结构','概率主义','选择权'],principles:24,models:8,
  chapters:[
   {t:'总纲',k:'从“看懂世界”转向“持续校正模型并扩大选择权”。',s:'2024年以后最明显的变化，是把早期的生存、博弈、祛魅重新整合进更大的认知与行动系统。重点不再只是看穿他人，而是识别大脑、身份和叙事如何共同塑造现实，再用行动与反馈持续修正。',p:[['事实与解释分开','先描述发生了什么，再讨论它意味着什么。'],['模型必须可证伪','如果一套理论永远不会错，它就很容易变成新叙事。'],['反馈高于自洽','现实与模型冲突时，先修模型。'],['选择权是终点','钱、技能、健康、关系与心理稳定都服务于减少“被迫”。']]},
   {t:'一、现实与认知',k:'地图不是地形，认知首先是一套需要被纠错的模型。',s:'事实会经过注意力、情绪、经验和预期的过滤。成熟期非常重视确认偏误、自证循环、动机性推理、控制错觉等机制。',p:[['事实 ≠ 解释','“他连续三次迟到”是事实，“他不尊重我”是解释。'],['警惕自证循环','你的预期可能驱动行为，并制造出证明原有判断的现实。'],['情绪是信号','情绪有信息价值，但不能直接当作事实判决。'],['任何模型都只是地图','包括墨苍离自己的模型。']]},
   {t:'二、叙事与自我',k:'故事不仅解释世界，还会派你去制造证据。',s:'“我是谁”“别人怎么看我”“过去说明了什么”都可能被叙事固化。成熟期更强调身份是动态模型，过去经历不应自动升级为永久身份。',p:[['叙事塑造注意力','你相信什么，就更容易看见支持它的证据。'],['身份不是本质','“我失败过”不等于“我是失败者”。'],['过去不是命运','过去是数据，不是未来的判决书。'],['改写需要新反馈','不是靠口号改身份，而是靠新的行为与现实结果。']]},
   {t:'三、行动与反馈',k:'认知若不能进入行动，就容易变成精神消费。',s:'成熟期明显反对“想清楚以后再行动”的幻觉。真正有效的认知应该能够改变预测、选择和行为，并通过现实反馈被不断修正。',p:[['思考可能替代行动','长时间没有新增现实信息时，可能是在循环。'],['最小实验优先','先做低成本、可逆、能产生信息的动作。'],['环境设计优于意志力','改变默认环境，往往比长期硬扛更可靠。'],['反馈驱动迭代','假设→行动→反馈→修正→扩大或停止。']]},
   {t:'四、关系与结构',k:'很多关系问题不是沟通问题，而是结构问题。',s:'关系由需求、资源、依赖、权力、信任、边界、违约成本和退出成本共同形成。语言和感情不能替代结构分析。',p:[['行为高于语言','长期行为、承担成本和压力下的选择更有信息量。'],['信任降低博弈成本','稳定信任可以减少监控、验证和重复谈判。'],['边界需要后果','没有执行能力的边界往往只是请求。'],['退出权决定谈判力','谁更不能离开，谁通常更弱。']]},
   {t:'五、普通人与概率',k:'阶层不是认知单变量，而是长期概率分布。',s:'资源、环境、试错能力、关系、时间和运气共同作用。普通人的现实策略不是寻找翻盘秘籍，而是持续提高好结果概率，同时避免被一次错误清零。',p:[['贫困占用认知带宽','生存压力会缩短时间尺度并降低长期规划能力。'],['避免灾难性错误','高杠杆、违法、毁灭性关系、健康透支都可能一次出局。'],['提高概率而非求确定','技能、环境、关系和缓冲都在重排未来概率。'],['注意力投向高杠杆','关注度应与可施加影响力匹配。']]},
   {t:'六、选择权与自主性',k:'真正的自由，是关键时刻拥有“不必这样做”的能力。',s:'财富和能力最深层的价值不是消费，而是让人能拒绝坏工作、坏关系和坏交易。成熟期的多条主线最终都汇入自主性。',p:[['资源→缓冲→退出权','缓冲越足，越能拒绝短期坏选择。'],['降低单点依赖','不要把收入、身份、关系或价值感压在一个节点上。'],['自主不是任性','不是想做什么就做什么，而是知道什么正在控制你。'],['长期扩大可选集合','评价策略时问：它让未来选择更多还是更少？']]}
  ],
  tools:[['认知校正模型','事实→解释→证据→反例→自证循环→更新模型'],['叙事拆解模型','故事→身份→忽略的信息→驱动的行为→新反馈'],['行动反馈模型','假设→最小实验→现实反馈→修正→扩大/停止'],['识人模型','长期行为→承担成本→一致性→利益冲突→修复能力'],['关系结构模型','需求→资源→依赖→权力→信任→边界→退出权'],['重大决策模型','最坏结果→可逆性→上行空间→信息增益→缓冲'],['阶层概率模型','下行风险→环境→技能复利→缓冲→关系网络→长期概率'],['选择权模型','当前依赖→单点风险→替代方案→缓冲资源→自主性']]
 },
 early:{
  title:'墨苍离 2024 以前思想框架',desc:'前期表达更锋利，也更偏生存与社会博弈：祛魅、保护资源、先不出局、心理资源、边界、信息优势、止损与撤退。',axis:['祛魅','保护资源','先不出局','边界','止损','长期生存'],principles:18,models:7,
  chapters:[
   {t:'总纲',k:'先祛魅、保资源、别出局，再谈赢。',s:'2024以前的稳定主线更加“生存主义”：不要神化人、阶层、专家和成功；保护金钱、注意力、心理韧性和信息；避免被责任、共鸣、攀比和关系耗尽；先保住筹码，再等机会。',p:[['先不输，再求赢','机会并不稀缺，稀缺的是还能留在牌桌上的筹码。'],['祛魅不是犬儒','祛魅是降低心理依赖，恢复独立判断。'],['心理资源也是资源','情绪韧性、注意力和自尊都可能被长期消耗。'],['责任必须有边界','无限负责最终可能让最重要的责任——对自己负责——失效。']]},
   {t:'一、祛魅与独立判断',k:'高期待 + 不独立，常常是痛苦的来源。',s:'对人、权威、专家、阶层、奢侈品、理想生活和社会身份主动祛魅。不是为了否定价值，而是避免神化以后失去判断力。',p:[['对人祛魅','任何人都有情境、能力和利益限制。'],['对权威祛魅','专家与学科也只是工具，不是终极真理。'],['对生活方式祛魅','奢侈、精致、上层生活不应自动成为价值尺度。'],['对自我祛魅','不要把“聪明”“善良”“受害者”等标签当本质。']]},
   {t:'二、先不出局',k:'生活和事业首先是一场风险管理。',s:'与其执着一次翻盘，不如保证自己还有下一轮。这个阶段特别强调不要梭哈、不要把筹码一次押光、不要为短期情绪做不可逆决策。',p:[['筹码比机会稀缺','没有筹码，再好的机会也无法参与。'],['不梭哈','控制单次失败对总体人生的破坏力。'],['止损优先','工作、关系和事业都应提前设退出条件。'],['允许撤退','资源透支时，撤回安全区恢复并不等于失败。']]},
   {t:'三、心理资源与情绪断奶',k:'廉价共鸣可以止痛，也可能强化旧处境。',s:'资源匮乏可能形成心理贫困：更需要认同、共鸣、攀比和即时补偿。长期沉浸在提供安慰却不产生行动的关系和信息里，会继续消耗改变处境所需的心理资源。',p:[['心理资源有限','长期羞耻、焦虑和内耗都会消耗行动能力。'],['警惕廉价共鸣','被理解不等于问题被解决。'],['情绪断奶','降低对只提供安慰却强化旧叙事的信息源的依赖。'],['先恢复再行动','心理资源耗尽时，先休整有时更理性。']]},
   {t:'四、边界、责任与善良',k:'善良不是无边界负责，道德需要选择权。',s:'责任外溢、讨好和无限宽容都会侵蚀个人资源。真正有价值的美德，往往发生在有能力反击、有其他选择时仍选择克制。',p:[['责任有对象和范围','不是所有人的问题都需要你承担。'],['没有后果的边界很弱','边界需要行动能力支撑。'],['善良需要能力','无力反击不等于主动克制。'],['多数人是“中性人”','不要用好人/坏人标签替代情境和行为分析。']]},
   {t:'五、信息优势与社交',k:'真诚不等于无边界自我暴露。',s:'秘密、表达节制和信息差具有现实价值。表现欲、倾诉欲和过度自我展示可能带来风险。社交中的夸奖、情绪价值和形象管理可以是工具，但不能替代长期信任。',p:[['信息也是资源','不是所有底牌都需要公开。'],['控制表现欲','展示越多，暴露的风险和可被利用的信息也越多。'],['情绪价值具有工具性','但不能把所有关系都降格为工具交换。'],['长期关系仍靠信任','短期技巧无法替代稳定信用。']]},
   {t:'六、环境、止损与复盘',k:'不要在单一环境里把旧直觉当成世界本身。',s:'环境长期塑造直觉、信息茧房和舒适区。需要周期性接触新城市、新领域、新人群和新技能；复盘时同时看个人变量和外部情境。',p:[['周期性换环境','通过新样本打破旧范式。'],['止损与止盈','不无限追加投入，也不要让关系吞噬全部资源。'],['中立性归因','既不把一切怪环境，也不把一切怪自己。'],['精简羁绊','无效社交和责任外溢会持续占用算力。']]}
  ],
  tools:[['祛魅模型','我神化了什么→它真实能提供什么→我为什么依赖它→替代解释'],['不出局模型','最大下行→筹码消耗→单次风险→退出条件→保留下一轮'],['心理资源模型','消耗源→廉价补偿→心理带宽→恢复方式→长期积累'],['责任边界模型','谁的责任→我的能力范围→继续承担的成本→退出或拒绝'],['信息边界模型','什么能说→什么不必说→谁需要知道→暴露成本'],['止损模型','投入→沉没成本→预设退出点→执行后果'],['环境切换模型','旧范式→新样本→新城市/行业/圈层→复盘更新']]
 }
};
let era='mature',current=0;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function render(){const d=DATA[era];$('#heroTitle').textContent=d.title;$('#heroDesc').textContent=d.desc;$('#axis').innerHTML=d.axis.map((x,i)=>`<span>${x}</span>${i<d.axis.length-1?'<b>→</b>':''}`).join('');$('#principleCount').textContent=d.principles;$('#modelCount').textContent=d.models;$('#toc').innerHTML=d.chapters.map((c,i)=>`<button class="toc-item ${i===current?'active':''}" data-i="${i}">${c.t}</button>`).join('')+'<button class="toc-item" data-tools="1">应用模型</button>';$('#content').innerHTML=d.chapters.map((c,i)=>`<article class="chapter ${i===current?'active':''}" data-index="${i}"><div class="chapter-head"><div class="chapter-num">${String(i+1).padStart(2,'0')}</div><div><h2>${c.t}</h2><p class="kicker">${c.k}</p></div></div><p class="summary">${c.s}</p><div class="points">${c.p.map(x=>`<div class="point"><h4>${x[0]}</h4><p>${x[1]}</p></div>`).join('')}</div></article>`).join('')+`<section class="section hidden" id="tools"><h2>应用模型</h2><p>遇到具体问题时，不必先读完整套框架，直接选择对应模型。</p><div class="grid">${d.tools.map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div></section>`;$$('.toc-item[data-i]').forEach(b=>b.onclick=()=>showChapter(+b.dataset.i));const tb=$('.toc-item[data-tools]');if(tb)tb.onclick=showTools;search($('#search').value)}
function showChapter(i){current=i;$$('.chapter').forEach(x=>x.classList.toggle('active',+x.dataset.index===i));$('#tools')?.classList.add('hidden');$$('.toc-item').forEach(x=>x.classList.remove('active'));$(`.toc-item[data-i="${i}"]`)?.classList.add('active');window.scrollTo({top:0,behavior:'smooth'});if(innerWidth<900)$('#sidebar').classList.remove('open')}
function showTools(){$$('.chapter').forEach(x=>x.classList.remove('active'));$('#tools')?.classList.remove('hidden');$$('.toc-item').forEach(x=>x.classList.remove('active'));$('.toc-item[data-tools]')?.classList.add('active');window.scrollTo({top:0,behavior:'smooth'});if(innerWidth<900)$('#sidebar').classList.remove('open')}
$$('.era').forEach(b=>b.onclick=()=>{era=b.dataset.era;current=0;$$('.era').forEach(x=>x.classList.toggle('active',x===b));render()});function search(q){q=(q||'').trim().toLowerCase();if(!q)return;const d=DATA[era];let idx=d.chapters.findIndex(c=>(c.t+c.k+c.s+JSON.stringify(c.p)).toLowerCase().includes(q));if(idx>=0)showChapter(idx);else if(JSON.stringify(d.tools).toLowerCase().includes(q))showTools()}
$('#search').addEventListener('input',e=>search(e.target.value));$('#clear').onclick=()=>{$('#search').value='';showChapter(current)};function setTheme(v){document.documentElement.dataset.theme=v;localStorage.setItem('thinking-theme',v)}const saved=localStorage.getItem('thinking-theme');if(saved)setTheme(saved);else if(matchMedia('(prefers-color-scheme:dark)').matches)setTheme('dark');$$('.theme-toggle').forEach(b=>b.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');render();
</script>
